name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # The Dockerfile runs `next build`, so this also fails the job on a
      # broken build — no separate typecheck step needed.
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            API_PROXY=http://badminton-be-rust:8090
          tags: ${{ secrets.DOCKER_USERNAME }}/badminton-fe:latest
          no-cache: true
          provenance: false
